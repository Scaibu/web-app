apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: web-app
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - env: dev
            namespace: web-app-dev
          - env: staging
            namespace: web-app-staging
          - env: prod
            namespace: web-app-prod
  template:
    metadata:
      name: "web-app-{{env}}"
    spec:
      project: web-app
      source:
        repoURL: https://github.com/Scaibu/web-app
        targetRevision: HEAD
        path: deploy/helm
        helm:
          valueFiles:
            - env-values/values.{{env}}.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
