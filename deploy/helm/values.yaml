replicaCount: 2

image:
  repository: scaibu/web-app
  pullPolicy: IfNotPresent
  digest: ""

service:
  type: ClusterIP
  port: 31400

ingress:
  enabled: false
  className: ""
  hosts: []
  tls: []

resources:
  limits:
    cpu: "1.0"
    memory: 512Mi
  requests:
    cpu: "250m"
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 75

nodeSelector: {}
tolerations: []
affinity: {}
